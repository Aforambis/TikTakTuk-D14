{% extends 'base.html' %}
{% block content %}
<div class="flex items-center justify-center min-h-[80vh]">
    <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 w-full max-w-md">
        <div class="text-center mb-8">
            <div class="w-12 h-12 bg-indigo-600 rounded-xl flex items-center justify-center mx-auto mb-4">
                <span class="text-white text-lg font-black">TT</span>
            </div>
            <h1 class="text-2xl font-bold text-gray-900">TikTakTuk</h1>
            <p class="text-gray-500 text-sm mt-2">Platform Manajemen Pertunjukan & Tiket</p>
        </div>
        
        {% if error %}
        <div class="bg-red-100 text-red-600 p-3 rounded-xl mb-4 text-sm font-semibold">
            {{ error }}
        </div>
        {% endif %}
        
        <form method="POST" action="">
            {% csrf_token %}
            <div class="mb-4">
                <label class="block text-xs font-semibold text-gray-500 mb-1.5">Username</label>
                <input type="text" name="username" placeholder="Masukkan username" class="w-full px-4 py-2 border rounded-xl bg-gray-50">
            </div>
            <div class="mb-6">
                <label class="block text-xs font-semibold text-gray-500 mb-1.5">Password</label>
                <input type="password" name="password" placeholder="Masukkan password" class="w-full px-4 py-2 border rounded-xl bg-gray-50">
            </div>
            <button type="submit" class="w-full bg-gray-900 text-white font-bold py-3 rounded-xl hover:bg-gray-800">Masuk</button>
        </form>
        <p class="text-center text-sm text-gray-500 mt-6">Belum punya akun? <a href="/auth/register/" class="text-indigo-600 font-semibold hover:underline">Daftar sekarang</a></p>
    </div>
</div>
{% endblock %}
