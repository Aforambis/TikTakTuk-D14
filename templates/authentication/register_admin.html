{% extends 'base.html' %}
{% block content %}
<div class="flex items-center justify-center min-h-[75vh]">
    <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 w-full max-w-md">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-900">Registrasi Admin</h1>
            <p class="text-gray-500 text-sm mt-1">Daftar sebagai pengelola sistem TikTakTuk</p>
        </div>
        
        {% if error %}
        <div class="bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-xl mb-5 text-sm font-semibold flex items-center gap-2">
            <i data-lucide="alert-circle" class="w-4 h-4"></i>
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-gray-500 mb-1.5 uppercase tracking-wide">Username</label>
                <input type="text" name="username" placeholder="Masukkan username admin" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl bg-gray-50 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-500 mb-1.5 uppercase tracking-wide">Password</label>
                <input type="password" name="password" placeholder="••••••••" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl bg-gray-50 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-500 mb-1.5 uppercase tracking-wide">Konfirmasi Password</label>
                <input type="password" name="confirm_password" placeholder="••••••••" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl bg-gray-50 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>

            <div class="flex items-start gap-3 py-2">
                <input type="checkbox" name="terms" id="terms" class="mt-1 w-4 h-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500">
                <label for="terms" class="text-xs text-gray-500 leading-relaxed">
                    Saya setuju dengan <a href="#" class="text-indigo-600 hover:underline">Syarat & Ketentuan</a> Administrator.
                </label>
            </div>
            
            <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl hover:bg-indigo-700 transition-colors shadow-sm">Buat Akun Admin</button>
        </form>
    </div>
</div>
{% endblock %}
