{% load static %}
<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}TikTakTuk{% endblock %}</title>

    <!-- Tailwind (for dashboard/ticketing UI) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Bootstrap (for existing yellow-group pages) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap");
      body {
        font-family: "Inter", sans-serif;
      }
    </style>

    {% block extra_head %}{% endblock %}
  </head>

  <body class="bg-slate-50 text-gray-800 min-h-screen d-flex flex-column">
    {% include "navbar.html" %}

    <main class="flex-1 w-100 px-4 py-4">
      {% block content %}{% endblock %}
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script>
      try {
        lucide.createIcons();
      } catch (e) {}
    </script>

    {% block extra_js %}{% endblock %}
    {% block extra_scripts %}{% endblock %}
  </body>
</html>
