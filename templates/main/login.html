{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login - TikTakTuk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#dbeafe] min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-[400px]">
        <!-- Logo & Header -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-[#2563eb] rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                <span class="text-white text-2xl font-black">TT</span>
            </div>
            <h1 class="text-2xl font-bold text-gray-900">TikTakTuk</h1>
            <p class="text-gray-500 text-sm">Platform Manajemen Pertunjukan & Tiket</p>
        </div>

        <!-- Login Card -->
        <div class="bg-white rounded-[2rem] shadow-xl p-8">
            <h2 class="text-lg font-bold text-gray-800 mb-1">Masuk ke Akun Anda</h2>
            <p class="text-xs text-gray-400 mb-6">Gunakan kredensial Anda untuk mengakses platform</p>

            {% if messages %}
                {% for message in messages %}
                <div class="mb-4 p-3 rounded-lg text-xs font-medium {% if message.tags == 'error' %}bg-red-50 text-red-600{% else %}bg-green-50 text-green-600{% endif %}">
                    {{ message }}
                </div>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="mb-4">
                    <label class="block text-xs font-semibold text-gray-500 mb-2 uppercase">Username</label>
                    <input type="text" name="username" placeholder="Masukkan username" required
                        class="w-full px-4 py-3 border border-gray-100 rounded-xl bg-gray-50 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                </div>
                <div class="mb-6">
                    <label class="block text-xs font-semibold text-gray-500 mb-2 uppercase">Password</label>
                    <input type="password" name="password" placeholder="Masukkan password" required
                        class="w-full px-4 py-3 border border-gray-100 rounded-xl bg-gray-50 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                </div>
                <button type="submit" class="w-full bg-[#1e293b] hover:bg-black text-white font-bold py-3 rounded-xl transition-colors shadow-lg">
                    Masuk
                </button>
            </form>
        </div>
        
        <p class="text-center mt-6 text-sm text-gray-500">
            Belum punya akun? <a href="#" class="text-blue-600 font-semibold hover:underline">Daftar sekarang</a>
        </p>
    </div>
</body>
</html>
